<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
     <link rel="Stylesheet" href="Style.css">
</head>
<body>


  <section class="booking-form" id="booking">
    <h2>Wedding Booking Form</h2>
    <p>Book your special day with us!</p>

    <form>
        <label>Full Name:</label>
        <input type="text" placeholder="Enter your name" required>

        <label>Mobile Number:</label>
        <input type="tel" placeholder="Enter mobile number" required>

        <label>Email:</label>
        <input type="email" placeholder="Enter your email">

        <label>Wedding Type:</label>
        <select required>
            <option value="">Select Wedding Type</option>
            <option>Traditional Marriage</option>
            <option>Royal Marriage</option>
            <option>Simple Marriage</option>
        </select>

        <label>Wedding Date:</label>
        <input type="date" required>

        <label>Venue:</label>
        <input type="text" placeholder="Enter wedding venue">

        <label>Message:</label>
        <textarea placeholder="Enter your requirements"></textarea>

        <button type="submit">Submit Booking</button>

      <a href="index.html" class="back-home">
    🏠 Back to Home
      </a>
</section>


</body>
</html>
